<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kliker Oyunu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Mənim Kliker Oyunum</h1>
        <div class="stats">
            <p>Xal: <span id="score">0</span></p>
            <p>Klik gücü: <span id="click-power">1</span></p>
            <p>Passiv gəlir: <span id="passive-income">0</span></p>
            <p id="combo-display"></p>
            <div id="boss-status"></div>
        </div>
        <div class="actions">
            <button id="click-btn">Kliklə!</button>
            <button id="start-boss-btn" onclick="startBossFight()">Boss Döyüşünü Başlat</button>
        </div>
        <div class="shop">
            <h2>Mağaza</h2>
            <button onclick="buyUpgrade('clickBoost')">Klik Gücünü Artır</button>
            <button onclick="buyUpgrade('autoMiner')">Avtomatik Qazıcı Al</button>
            <button onclick="buyUpgrade('quantumCore')">Kvant Nüvəsi Al</button>
        </div>
        <div class="wallets">
            <p>Holding Valyutası: <span id="holding-wallet">0</span></p>
            <p>Pul Valyutası: <span id="pool-wallet">0</span></p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
